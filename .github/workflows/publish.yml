name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC); no stored token
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm test
      - run: npm publish --access public   # provenance is added automatically with trusted publishing
